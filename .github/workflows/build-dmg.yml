name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a main-branch release after semantic-release starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Determine app version
        id: app_version
        run: |
          set -euo pipefail

          marketing_version="$(
            awk '
              /^[[:space:]]*MARKETING_VERSION = / {
                sub(/^[[:space:]]*MARKETING_VERSION = /, "")
                sub(/;.*/, "")
                print
                exit
              }
            ' PolyDrom.xcodeproj/project.pbxproj
          )"
          test -n "$marketing_version"

          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        env:
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -clonedSourcePackagesDirPath "$SPM_PATH"

      - name: Run unit and rendering tests
        env:
          TEST_DERIVED_DATA_PATH: ${{ runner.temp }}/PolyDrom-TestData
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild test \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$TEST_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_PATH" \
            -only-testing:PolyDromTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build release archive
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          MARKETING_VERSION: ${{ steps.app_version.outputs.marketing_version }}
          RELEASE_DERIVED_DATA_PATH: ${{ runner.temp }}/PolyDrom-ReleaseData
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild archive \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RELEASE_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_PATH" \
            ARCHS=arm64 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify archive version metadata
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          EXPECTED_MARKETING_VERSION: ${{ steps.app_version.outputs.marketing_version }}
        run: |
          set -euo pipefail

          info_plist="$ARCHIVE_PATH/Products/Applications/PolyDrom.app/Contents/Info.plist"
          test -f "$info_plist"

          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"

          if [[ "$marketing_version" != "$EXPECTED_MARKETING_VERSION" ]]; then
            echo "Expected marketing version '$EXPECTED_MARKETING_VERSION', found '$marketing_version'." >&2
            exit 1
          fi

          if [[ "$bundle_version" != "$GITHUB_RUN_NUMBER" ]]; then
            echo "Expected bundle version '$GITHUB_RUN_NUMBER', found '$bundle_version'." >&2
            exit 1
          fi

      - name: Ad-hoc sign release app
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
        run: |
          set -euo pipefail

          app_path="$ARCHIVE_PATH/Products/Applications/PolyDrom.app"
          bash scripts/sign-app.sh "$app_path"

      - name: Package DMG
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          ARTIFACTS_PATH: ${{ runner.temp }}/PolyDrom-artifacts
        run: |
          set -euo pipefail

          app_path="$ARCHIVE_PATH/Products/Applications/PolyDrom.app"
          test -d "$app_path"
          test -d "$app_path/Contents/Frameworks/Sparkle.framework"

          staging_path="$(mktemp -d "$RUNNER_TEMP/PolyDrom-dmg.XXXXXX")"
          ditto "$app_path" "$staging_path/PolyDrom.app"
          ln -s /Applications "$staging_path/Applications"

          mkdir -p "$ARTIFACTS_PATH"
          hdiutil create \
            -volname "PolyDrom" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$ARTIFACTS_PATH/PolyDrom.dmg"
          hdiutil verify "$ARTIFACTS_PATH/PolyDrom.dmg"
          (cd "$ARTIFACTS_PATH" && shasum -a 256 PolyDrom.dmg > PolyDrom.dmg.sha256)

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyDrom-dmg
          path: ${{ runner.temp }}/PolyDrom-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: npm run release

      - name: Verify published Sparkle appcast
        if: steps.semantic_release.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.semantic_release.outputs.release_tag }}
        run: |
          set -euo pipefail

          appcast_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          appcast_path="$RUNNER_TEMP/PolyDrom-appcast.xml"
          curl --fail --location --silent --show-error --output "$appcast_path" "$appcast_url"
          xmllint --noout "$appcast_path"
          grep -Fq "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/PolyDrom.dmg" "$appcast_path"
