name: Build DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release from this run's DMG
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional tag to create (defaults to the app marketing version)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.app_version.outputs.release_tag }}
      default_release_tag: ${{ steps.app_version.outputs.default_release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Determine release metadata
        id: app_version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          marketing_version="$(
            awk '
              /^[[:space:]]*MARKETING_VERSION = / {
                sub(/^[[:space:]]*MARKETING_VERSION = /, "")
                sub(/;.*/, "")
                print
                exit
              }
            ' PolyDrom.xcodeproj/project.pbxproj
          )"
          test -n "$marketing_version"
          default_release_tag="v${marketing_version}"

          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            release_tag="$RELEASE_TAG_INPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$default_release_tag"
          fi

          [[ "$release_tag" == v* ]] || {
            echo "Release tags must start with v." >&2
            exit 1
          }

          echo "default_release_tag=$default_release_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve Swift packages
        env:
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -clonedSourcePackagesDirPath "$SPM_PATH"

      - name: Run unit and rendering tests
        env:
          TEST_DERIVED_DATA_PATH: ${{ runner.temp }}/PolyDrom-TestData
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild test \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$TEST_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_PATH" \
            -only-testing:PolyDromTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build release archive
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          RELEASE_DERIVED_DATA_PATH: ${{ runner.temp }}/PolyDrom-ReleaseData
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
        run: |
          xcodebuild archive \
            -project PolyDrom.xcodeproj \
            -scheme PolyDrom \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RELEASE_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_PATH" \
            ARCHS=arm64 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package DMG
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          ARTIFACTS_PATH: ${{ runner.temp }}/PolyDrom-artifacts
        run: |
          set -euo pipefail

          app_path="$ARCHIVE_PATH/Products/Applications/PolyDrom.app"
          test -d "$app_path"
          test -d "$app_path/Contents/Frameworks/Sparkle.framework"

          staging_path="$(mktemp -d "$RUNNER_TEMP/PolyDrom-dmg.XXXXXX")"
          ditto "$app_path" "$staging_path/PolyDrom.app"
          ln -s /Applications "$staging_path/Applications"

          mkdir -p "$ARTIFACTS_PATH"
          hdiutil create \
            -volname "PolyDrom" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$ARTIFACTS_PATH/PolyDrom.dmg"
          hdiutil verify "$ARTIFACTS_PATH/PolyDrom.dmg"
          (cd "$ARTIFACTS_PATH" && shasum -a 256 PolyDrom.dmg > PolyDrom.dmg.sha256)

      - name: Generate signed Sparkle appcast
        if: inputs.create_release == true || startsWith(github.ref, 'refs/tags/v')
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/PolyDrom.xcarchive
          ARTIFACTS_PATH: ${{ runner.temp }}/PolyDrom-artifacts
          RELEASE_TAG: ${{ steps.app_version.outputs.release_tag }}
          SPM_PATH: ${{ runner.temp }}/PolyDrom-SourcePackages
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SPARKLE_ED_PRIVATE_KEY" || {
            echo "SPARKLE_ED_PRIVATE_KEY is required for release builds." >&2
            exit 1
          }

          sign_update="$(find "$SPM_PATH" -type f -path '*/Sparkle/bin/sign_update' -print -quit)"
          test -x "$sign_update"

          app_path="$ARCHIVE_PATH/Products/Applications/PolyDrom.app"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist")"
          test "$bundle_version" = "$GITHUB_RUN_NUMBER"

          # Sparkle's generate_appcast rejects this intentionally unsigned app.
          # The helper uses Sparkle's sign_update to create the same appcast
          # metadata while leaving the distributed app and DMG unsigned.
          RELEASE_TAG="$RELEASE_TAG" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            SPARKLE_ED_PRIVATE_KEY="$SPARKLE_ED_PRIVATE_KEY" \
            bash scripts/generate-appcast.sh \
              "$app_path" \
              "$ARTIFACTS_PATH/PolyDrom.dmg" \
              "$sign_update" \
              "$ARTIFACTS_PATH/appcast.xml"

          xmllint --noout "$ARTIFACTS_PATH/appcast.xml"
          grep -Eq 'sparkle:edSignature="[^"]+"' "$ARTIFACTS_PATH/appcast.xml"
          grep -Fq "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/PolyDrom.dmg" "$ARTIFACTS_PATH/appcast.xml"
          ! grep -Fq "/releases/tag/" "$ARTIFACTS_PATH/appcast.xml"

          feed_url="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app_path/Contents/Info.plist")"
          test "$feed_url" = "https://github.com/zikasak/Polydrom/releases/latest/download/appcast.xml"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyDrom-dmg
          path: ${{ runner.temp }}/PolyDrom-artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.create_release == true || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: PolyDrom-dmg
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            release-assets/PolyDrom.dmg \
            release-assets/PolyDrom.dmg.sha256 \
            release-assets/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "PolyDrom $RELEASE_TAG" \
            --generate-notes

          appcast_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          curl --fail --location --silent --show-error "$appcast_url" > /tmp/PolyDrom-appcast.xml
          xmllint --noout /tmp/PolyDrom-appcast.xml
          grep -Fq "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/PolyDrom.dmg" /tmp/PolyDrom-appcast.xml
